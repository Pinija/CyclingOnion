[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["weather", "wardrobe", "outfitter", "cyclingonion_app"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == .__main__.:']

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
